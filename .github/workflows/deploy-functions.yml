name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::Missing GitHub secret SUPABASE_PROJECT_REF"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          supabase functions deploy api --yes --project-ref "$PROJECT_REF"
          supabase functions deploy webhook-mobile-money --no-verify-jwt --yes --project-ref "$PROJECT_REF"
          supabase functions deploy worker-notifications --no-verify-jwt --yes --project-ref "$PROJECT_REF"
          supabase functions deploy worker-device-commands --no-verify-jwt --yes --project-ref "$PROJECT_REF"
