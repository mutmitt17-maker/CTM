name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  unit-tests:
    name: Tests unitaires (core-model, core-network, core-security, app-agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile et teste
        run: gradle :core-model:test :core-network:test :core-security:test :app-agent:test :agent-http:test --no-daemon --stacktrace
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            android/core-model/build/reports/tests/test
            android/core-network/build/reports/tests/test
            android/core-security/build/reports/tests/test
            android/app-agent/build/reports/tests/test
          if-no-files-found: ignore
