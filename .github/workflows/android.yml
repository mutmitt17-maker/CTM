name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  unit-tests:
    name: Tests unitaires (core-model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile et teste
        run: gradle :core-model:test --no-daemon --stacktrace
      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-core-model
          path: android/core-model/build/reports/tests/test
          if-no-files-found: ignore
