name: CI

on:
  push:
  pull_request:

jobs:
  migrations:
    name: Apply all migrations on PostgreSQL 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase shim
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/00_supabase_shim.sql
      - name: Apply migrations in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "=== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Scenario test (onboarding to ownership transfer)
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/smoke_test.sql

  functions:
    name: Type-check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions/*/index.ts
