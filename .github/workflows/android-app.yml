name: Android App

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Application agent (APK de test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/agent-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prépare le SDK Android (API 36)
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}/cmdline-tools/"*/bin/sdkmanager | sort -V | tail -n 1)"
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Fabrique l’APK de test
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Garde l’APK
        uses: actions/upload-artifact@v4
        with:
          name: ctm-agent-debug-apk
          path: android/agent-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
