name: Android App

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Application agent (APK de test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/agent-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Fabrique l’APK de test
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Garde l’APK
        uses: actions/upload-artifact@v4
        with:
          name: ctm-agent-debug-apk
          path: android/agent-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
