<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a id="brand" class="brand" href="./" aria-label="CTM, actualiser la page">CTM</a>
    <span id="who"></span>
    <button id="logout" hidden>Se déconnecter</button>
  </header>

  <main>
    <section id="login">
      <h1>Se connecter</h1>
      <p class="sub">Veuillez saisir votre email et mot de passe</p>
      <form id="login-form">
        <label>Email
          <input id="email" class="with-icon icon-mail" type="email" placeholder="Email" required autocomplete="username">
        </label>
        <label>Mot de passe
          <input id="password" class="with-icon icon-lock" type="password" placeholder="Mot de passe" required autocomplete="current-password">
        </label>
        <button type="submit" class="login-btn">Se connecter</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <section id="app" hidden>
      <nav id="nav"></nav>
      <div id="view"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
