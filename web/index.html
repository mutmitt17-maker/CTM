<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back-office Crédit Téléphone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>Back-office Crédit Téléphone</strong>
    <span id="who"></span>
    <button id="logout" hidden>Se déconnecter</button>
  </header>

  <main>
    <section id="login">
      <h2>Connexion</h2>
      <form id="login-form">
        <label>E-mail <input id="email" type="email" required autocomplete="username"></label>
        <label>Mot de passe <input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Se connecter</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <section id="app" hidden>
      <nav id="nav"></nav>
      <div id="view"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
