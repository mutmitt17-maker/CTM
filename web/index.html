<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0e93a8">
  <title>CTM · Crédit Téléphone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e93a8'/%3E%3Crect x='11' y='6' width='10' height='20' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M14.5 22.5h3' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#view">Aller au contenu</a>

  <header class="topbar">
    <button id="menu-toggle" class="icon-btn menu-toggle" type="button" aria-label="Ouvrir le menu" aria-controls="nav" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a id="brand" class="brand" href="./" aria-label="CTM, actualiser la page">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M10.5 17.5h3"/></svg>
      </span>
      <span class="brand-name">CTM</span>
    </a>
    <span id="who" class="who"></span>
    <button id="logout" class="btn ghost" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg>
      <span>Se déconnecter</span>
    </button>
  </header>

  <main>
    <section id="login" class="auth-card">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M10.5 17.5h3"/></svg>
      </div>
      <h1>Se connecter</h1>
      <p class="sub">Veuillez saisir votre email et mot de passe</p>
      <form id="login-form">
        <label class="field">
          <span class="field-label">Email</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="email" type="email" placeholder="vous@exemple.com" required autocomplete="username" autocapitalize="off" spellcheck="false">
          </span>
        </label>
        <label class="field">
          <span class="field-label">Mot de passe</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" type="password" placeholder="Votre mot de passe" required autocomplete="current-password">
            <button id="toggle-password" class="reveal" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7c1.5 0 2.9-.3 4.1-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </span>
        </label>
        <p class="forgot"><a href="#" id="forgot">Mot de passe oublié ?</a></p>
        <button type="submit" class="btn primary block lg login-btn">Se connecter</button>
        <p id="login-error" class="form-msg error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="reset" class="auth-card" hidden>
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <h1>Nouveau mot de passe</h1>
      <p class="sub">Choisissez un nouveau mot de passe (8 caractères minimum)</p>
      <form id="reset-form">
        <label class="field">
          <span class="field-label">Nouveau mot de passe</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="new-password" type="password" placeholder="Nouveau mot de passe" minlength="8" required autocomplete="new-password">
          </span>
        </label>
        <button type="submit" class="btn primary block lg login-btn">Enregistrer</button>
        <p id="reset-error" class="form-msg error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="app" class="shell" hidden>
      <nav id="nav" class="sidenav" aria-label="Navigation principale"></nav>
      <div id="view" class="view" tabindex="-1"></div>
    </section>
  </main>

  <div id="scrim" class="scrim" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
